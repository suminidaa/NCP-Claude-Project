<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}나의 가계부{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">💰 나의 가계부<span class="brand-sub">영수증으로 똑똑하게 기록</span></a>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span class="toast-emoji">✅</span>
    <span class="toast-message">저장이 완료되었습니다</span>
  </div>
  <script>
    window.showToast = function (message) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.querySelector(".toast-message").textContent = message || "저장이 완료되었습니다";
      el.hidden = false;
      requestAnimationFrame(() => el.classList.add("show"));
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        el.classList.remove("show");
        setTimeout(() => { el.hidden = true; }, 240);
      }, 2200);
    };
  </script>
</body>
</html>
